server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
        add_header Cache-Control "private, no-store" always;
    }
    location = /health {
        proxy_pass http://backend:8000;
        add_header Cache-Control no-store always;
    }
    # Market exports are deliberately absent from this release.
    location /snapshots/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = / { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /app { try_files /index.html =404; add_header Cache-Control no-cache; }
    location /app/ { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /login { try_files /index.html =404; add_header Cache-Control no-cache; }
    location / { try_files $uri =404; }
}
