name: auraxis
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: Auraxis
      PORT: "8000"
      DATABASE_URL: sqlite:////data/auraxis.db
      DATA_CACHE_DIR: /data/data_cache
      AUTH_DATABASE_PATH: /data/auth.sqlite3
      WORKSPACE_DATABASE_PATH: /data/workspaces.sqlite3
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the exact assigned frontend HTTPS origin}
    volumes:
      - private-data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:${AURAXIS_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  private-data:
